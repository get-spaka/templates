    label: Cover picture
    kind: image
  - name: cover_caption
    label: Cover caption
    kind: text
  - name: topics
    label: Topics
    kind: list
  - name: minutes
    label: Minutes to read
    kind: number
  - name: author
    label: Written by
    kind: text
  - name: featured
