# Each tag v* builds a release of the templates from their sources: the
# catalogue, the pictures and one .zip per template, attached to the GitHub
# release the Upstart app reads (its latest one). Nothing built is committed.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lint, as Upstart's repository does
        run: npx --yes @biomejs/biome@2.6.6 ci .
      - name: Check and build the templates
        # The previous release's catalogue gives the earlier versions older apps
        # still need: the latest release's, except for v10, which starts from
        # v8's (Q380): v9 lists Aspect 1.1.0 without the app it needs, and
        # Aspect 1.0.0, which any app opens, is in v8 only.
        run: |
          releases="https://github.com/$GITHUB_REPOSITORY/releases"
          if [ "$GITHUB_REF_NAME" = v10 ]; then previous="$releases/download/v8/catalogue.json"
          else previous="$releases/latest/download/catalogue.json"; fi
          node scripts/release.mjs . dist "$GITHUB_REF_NAME" "$previous"
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/catalogue.json dist/*.webp dist/*.zip --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
