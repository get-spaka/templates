# Each tag v* builds a release of the templates from their sources: the
# catalogue, the pictures and one .zip per template, attached to the GitHub
# release the Spaka app reads (its latest one). Nothing built is committed.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lint, as Spaka's repository does
        run: npx --yes @biomejs/biome@2.6.6 ci .
      - name: Check and build the templates
        # The previous release's catalogue gives the earlier versions older apps
        # still need. This repository's first release has none before it.
        run: |
          releases=$(gh release list --limit 1 --json tagName --jq '.[].tagName')
          previous=()
          [ -n "$releases" ] && previous=("https://github.com/$GITHUB_REPOSITORY/releases/latest/download/catalogue.json")
          node scripts/release.mjs . dist "$GITHUB_REF_NAME" "${previous[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/catalogue.json dist/*.webp dist/*.zip --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
