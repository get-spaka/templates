# Each tag v* builds a release of the templates from their sources: the
# catalogue, the pictures and one .zip per template, attached to the GitHub
# release the Upstart app reads (its latest one). Nothing built is committed.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check and build the templates
        # The latest release's catalogue gives the earlier versions older apps still need.
        run: node scripts/release.mjs . dist "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/catalogue.json"
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/catalogue.json dist/*.webp dist/*.zip --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
