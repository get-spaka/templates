    label: Role
    kind: text
    required: true
  - name: organization
    label: Organization
    kind: text
    required: true
  - name: place
    label: Town
    kind: text
  - name: start
    label: Started
    kind: date
    required: true
  - name: end
    label: Ended (empty while it lasts)
    kind: date
  - name: kind
    label: Kind
    kind: choice
    choices: [job, contract, volunteer]
  - name: summary
    label: In one line
